<svg width="240" height="54" viewBox="0 0 240 54" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#0A5F6B" />
    </linearGradient>
    <linearGradient id="pulseTealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="crestBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0A5F6B" stop-opacity="0.3" />
    </linearGradient>
    <filter id="crestShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0A2540" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Precision Healthcare Shield & Vitality Cross Emblem -->
  <g transform="translate(4, 5)" filter="url(#crestShadow)">
    <rect x="0" y="0" width="44" height="44" rx="13" fill="url(#shieldNavyGrad)" />
    <rect x="0" y="0" width="44" height="44" rx="13" stroke="url(#crestBorderGrad)" stroke-width="1.2" />

    <!-- Sculpted Medical Cross -->
    <rect x="18.5" y="8" width="7" height="28" rx="3.5" fill="#FFFFFF" />
    <rect x="8" y="18.5" width="28" height="7" rx="3.5" fill="#FFFFFF" />

    <!-- Dynamic ECG Pulse Wave -->
    <path 
      d="M10 22 H15 L17.5 15 L21.5 29 L24.5 19 L26.5 22 H34" 
      stroke="url(#pulseTealGrad)" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Radiant Core Node -->
    <circle cx="21.5" cy="22" r="2" fill="#0A5F6B" />
    <circle cx="21.5" cy="22" r="1" fill="#2DD4BF" />
  </g>

  <!-- Brand Typography Lockup -->
  <g transform="translate(60, 10)">
    <!-- Brand Name: MEDLIX -->
    <text x="0" y="22" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#0A2540" letter-spacing="-0.5">MEDLIX</text>

    <!-- Subtitle: SUPER SPECIALTY HOSPITALS -->
    <text x="1" y="34" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="8.5" fill="#0A5F6B" letter-spacing="2.4">SUPER SPECIALTY HOSPITALS</text>
  </g>
</svg>
